<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 400px;
      min-height: 500px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: linear-gradient(135deg, #F4EEFF 0%, #DCD6F7 100%);
    }

    .header {
      background: linear-gradient(135deg, #A6B1E1 0%, #424874 100%);
      color: white;
      padding: 20px;
      text-align: center;
    }

    .header h1 {
      font-size: 24px;
      margin-bottom: 5px;
    }

    .header p {
      font-size: 12px;
      opacity: 0.9;
    }

    .container {
      padding: 20px;
    }

    .auth-section {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .input-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 500;
      color: #424874;
      font-size: 14px;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      border: 2px solid #E4E1F6;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.3s;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: #A6B1E1;
    }

    textarea {
      min-height: 150px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #A6B1E1 0%, #424874 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(166, 177, 225, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    .success {
      background: #10b981;
      color: white;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 15px;
      text-align: center;
      display: none;
    }

    .error {
      background: #ef4444;
      color: white;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 15px;
      text-align: center;
      display: none;
    }

    .logged-in, .logged-out {
      display: none;
    }

    .note-form {
      display: none;
    }

    .status {
      text-align: center;
      padding: 10px;
      font-size: 12px;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>📝 QuickNotes</h1>
    <p>Capture ideas instantly</p>
  </div>

  <div class="container">
    <div class="success" id="success"></div>
    <div class="error" id="error"></div>

    <div class="logged-out">
      <div class="auth-section">
        <div class="input-group">
          <label>API URL</label>
          <input type="text" id="apiUrl" placeholder="http://localhost:3000" value="http://localhost:3000">
        </div>
        <div class="input-group">
          <label>Email</label>
          <input type="email" id="email" placeholder="your@email.com">
        </div>
        <div class="input-group">
          <label>Password</label>
          <input type="password" id="password" placeholder="••••••">
        </div>
        <button id="loginBtn">Login</button>
      </div>
    </div>

    <div class="logged-in">
      <div class="note-form">
        <div class="input-group">
          <label>Title</label>
          <input type="text" id="noteTitle" placeholder="Note title">
        </div>
        <div class="input-group">
          <label>Content</label>
          <textarea id="noteContent" placeholder="Write your note here..."></textarea>
        </div>
        <div class="input-group">
          <label>Tags (comma separated)</label>
          <input type="text" id="noteTags" placeholder="work, ideas, todo">
        </div>
        <button id="saveNoteBtn">Save Note</button>
      </div>
      <button id="logoutBtn" style="margin-top: 10px; background: #6b7280;">Logout</button>
    </div>

    <div class="status" id="status">Checking login status...</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
